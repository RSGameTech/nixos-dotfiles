tagrule=id:1,layout_name:vertical_scroller,no_render_border:1
tagrule=id:2,layout_name:vertical_scroller,no_render_border:1
tagrule=id:3,layout_name:vertical_scroller,no_render_border:1
tagrule=id:4,layout_name:vertical_scroller,no_render_border:1
tagrule=id:5,layout_name:vertical_scroller,no_render_border:1
